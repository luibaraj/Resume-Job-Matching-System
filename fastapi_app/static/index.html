<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Matcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
            padding-top: 20px;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .form-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1em;
            resize: vertical;
            min-height: 200px;
            margin-bottom: 20px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .input-group {
            display: flex;
            gap: 15px;
            align-items: flex-end;
            margin-bottom: 20px;
        }

        .input-group > div {
            flex: 1;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 1em;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results {
            margin-top: 30px;
        }

        .error {
            background: #fee;
            border: 2px solid #f99;
            color: #c33;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            color: white;
            font-size: 1.1em;
            padding: 30px;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .matches-grid {
            display: grid;
            gap: 20px;
            margin-top: 20px;
        }

        .match-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .match-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .match-title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }

        .match-score {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.95em;
        }

        .match-explanation {
            color: #666;
            line-height: 1.6;
            font-size: 0.95em;
        }

        .empty-state {
            text-align: center;
            color: white;
            padding: 40px 20px;
            font-size: 1.1em;
        }

        .no-results {
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed white;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>💼 Job Matcher</h1>
            <p>Find your perfect job match in seconds</p>
        </header>

        <div class="form-card">
            <form id="matchForm">
                <label for="resume">Your Resume</label>
                <textarea
                    id="resume"
                    name="resume"
                    placeholder="Paste your resume text here..."
                    required
                ></textarea>

                <div class="input-group">
                    <div>
                        <label for="topK">Number of matches</label>
                        <input
                            type="number"
                            id="topK"
                            name="topK"
                            value="10"
                            min="1"
                            max="50"
                        >
                    </div>
                    <button type="submit">Find Matches</button>
                </div>
            </form>
        </div>

        <div id="resultsContainer"></div>
    </div>

    <script>
        const form = document.getElementById('matchForm');
        const resumeInput = document.getElementById('resume');
        const topKInput = document.getElementById('topK');
        const resultsContainer = document.getElementById('resultsContainer');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            await handleSubmit();
        });

        async function handleSubmit() {
            const resume = resumeInput.value.trim();
            const topK = parseInt(topKInput.value);

            if (!resume) {
                showError('Please paste your resume');
                return;
            }

            if (resume.length < 50) {
                showError('Resume must be at least 50 characters');
                return;
            }

            showLoading();

            try {
                const response = await fetch('/match', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        resume: resume,
                        top_k: topK
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    showError(data.detail || 'Failed to find matches');
                    return;
                }

                displayResults(data.matches);
            } catch (error) {
                showError(error.message || 'An error occurred');
            }
        }

        function showLoading() {
            resultsContainer.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Finding your perfect matches...</p>
                </div>
            `;
        }

        function showError(message) {
            resultsContainer.innerHTML = `
                <div class="error">
                    <strong>Error:</strong> ${escapeHtml(message)}
                </div>
            `;
        }

        function displayResults(matches) {
            if (matches.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <p>No job matches found. Try adjusting your resume or the number of matches.</p>
                    </div>
                `;
                return;
            }

            const html = `
                <div class="results">
                    <h2 style="color: white; margin-bottom: 20px;">Found ${matches.length} matches</h2>
                    <div class="matches-grid">
                        ${matches.map(match => `
                            <div class="match-card">
                                <div class="match-header">
                                    <div class="match-title">${escapeHtml(match.title)}</div>
                                    <div class="match-score">${(match.score * 100).toFixed(1)}%</div>
                                </div>
                                ${match.explanation ? `
                                    <div class="match-explanation">
                                        <strong>Why it matches:</strong> ${escapeHtml(match.explanation)}
                                    </div>
                                ` : ''}
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            resultsContainer.innerHTML = html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
